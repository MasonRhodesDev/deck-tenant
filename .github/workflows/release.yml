name: Release

# No COPR for this repo (SteamOS is Arch-based); the reusable workflow's copr
# job self-skips when COPR_WEBHOOK_URL is not configured.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@d85cbe2888dc868016c85452f7c339405b8528c1
    secrets: inherit
    with:
      rpm: false
