name: Release

# No COPR for this repo (SteamOS is Arch-based); rpm: false skips the COPR
# job. ARCH_REPO_TOKEN is still required so the tag republishes [mason].

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@3d0c5630674f086918226d0140c51b97887c799f # v1
    secrets: inherit
    with:
      rpm: false
